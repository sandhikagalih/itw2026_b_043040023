<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Box Model</title>
    <style>
      .kotak1 {
        width: 100px;
        height: 100px;
        background-color: lightblue;
        margin: auto;
      }

      .kotak2 {
        width: 150px;
        height: 150px;
        background-color: salmon;
        padding: 15px;
        border: 10px solid red;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="kotak1">kotak 1</div>
    <div class="kotak2">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Nulla culpa consequuntur omnis ratione..</div>
  </body>
</html>
